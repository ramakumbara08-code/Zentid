<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Digital - Zent.id</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 20px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        #camera-view, #photo-preview { width: 100%; border-radius: 15px; transform: scaleX(-1); background: #000; }
        #loading-overlay { z-index: 9999; background: rgba(255,255,255,0.9); position: fixed; top: 0; left: 0; }
        .login-header { background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%); color: white; padding: 40px 20px; border-radius: 20px 20px 0 0; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="hidden d-flex justify-content-center align-items-center w-100 h-100">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container py-5">
        <div id="login-page" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card overflow-hidden">
                    <div class="login-header text-center">
                        <i class="bi bi-building-lock display-4"></i>
                        <h3 class="mt-3 fw-bold">Presensi Digital</h3>
                        <p class="mb-0">Multi-Company SaaS Version</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">ID PERUSAHAAN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-building"></i></span>
                                    <input type="text" id="company-id" class="form-control bg-light border-start-0" placeholder="Contoh: ZENT01" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">ID PEGAWAI</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                    <input type="text" id="id-pegawai" class="form-control bg-light border-start-0" placeholder="ID Pegawai" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">PASSWORD</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                                    <input type="password" id="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">MASUK</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="menu-page" class="row justify-content-center hidden">
            <div class="col-md-6">
                <div class="card p-4 text-center">
                    <div class="d-flex align-items-center mb-4 text-start">
                        <div class="bg-primary text-white rounded-circle p-3 me-3">
                            <i class="bi bi-person-circle fs-3"></i>
                        </div>
                        <div>
                            <h5 id="display-name" class="mb-0 fw-bold">-</h5>
                            <p id="display-job" class="text-muted small mb-0">-</p>
                        </div>
                        <button id="logout-button" class="btn btn-link ms-auto text-danger"><i class="bi bi-box-arrow-right fs-4"></i></button>
                    </div>
                    
                    <div class="row g-3">
                        <div class="col-6">
                            <button onclick="prepareAction('MASUK')" class="btn btn-outline-primary w-100 py-4 card">
                                <i class="bi bi-box-arrow-in-right fs-1 mb-2"></i>
                                <span>MASUK</span>
                            </button>
                        </div>
                        <div class="col-6">
                            <button onclick="prepareAction('PULANG')" class="btn btn-outline-success w-100 py-4 card">
                                <i class="bi bi-box-arrow-right fs-1 mb-2"></i>
                                <span>PULANG</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="action-page" class="row justify-content-center hidden">
            <div class="col-md-6">
                <div class="card p-4">
                    <div class="d-flex align-items-center mb-3">
                        <button onclick="showPage('menu-page')" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></button>
                        <h5 class="mb-0 fw-bold">Absensi <span id="action-label"></span></h5>
                    </div>
                    <div class="position-relative mb-3">
                        <video id="camera-view" autoplay playsinline></video>
                        <img id="photo-preview" class="hidden">
                        <button id="btn-capture" class="btn btn-primary rounded-circle position-absolute bottom-0 start-50 translate-middle-x mb-3 shadow" style="width:60px; height:60px;">
                            <i class="bi bi-camera-fill fs-4"></i>
                        </button>
                    </div>
                    <div id="extra-fields">
                        <div id="field-masuk" class="mb-3 hidden">
                            <label class="form-label small fw-bold">Keterangan Masuk</label>
                            <input type="text" id="ket-masuk" class="form-control" placeholder="Tujuan hari ini">
                        </div>
                        <div id="field-pulang" class="mb-3 hidden">
                            <label class="form-label small fw-bold">Realisasi Pekerjaan</label>
                            <textarea id="ket-pulang" class="form-control" rows="3" placeholder="Laporan hari ini"></textarea>
                        </div>
                    </div>
                    <button id="btn-submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mt-2">KIRIM ABSENSI</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEBAPP DARI SPREADSHEET MASTER ANDA
        const MASTER_URL = "https://script.google.com/macros/s/AKfycbxPF6sDSg9sYx-zxzob_e6cltBRlEY4yhUnauWN0ttvPXFEdMMzMgZb8YQhe--smfaZVw/exec"; 

        let userData = null;
        let clientUrl = "";
        let userGPS = "";
        let photo = "";
        let stream = null;
        let currentStatus = "";

        // Load Company ID dari memori browser
        window.onload = () => {
            const savedId = localStorage.getItem('company_id');
            if(savedId) document.getElementById('company-id').value = savedId;
        };

        function showPage(id) {
            ['login-page', 'menu-page', 'action-page'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id !== 'action-page' && stream) { stream.getTracks().forEach(t => t.stop()); }
        }

        // PROSES LOGIN (DENGAN HANDSHAKE MASTER)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const companyId = document.getElementById('company-id').value.toUpperCase();
            const idPegawai = document.getElementById('id-pegawai').value;
            const password = document.getElementById('password').value;

            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                // 1. Handshake ke Master Script
                const masterRes = await fetch(MASTER_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_client_config', companyId: companyId })
                });
                const masterData = await masterRes.json();

                if(!masterData.success) throw new Error(masterData.message);

                clientUrl = masterData.url;
                localStorage.setItem('company_id', companyId);

                // 2. Login ke Database Perusahaan
                const loginRes = await fetch(clientUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', idPegawai: idPegawai, password: password })
                });
                const loginData = await loginRes.json();

                document.getElementById('loading-overlay').classList.add('hidden');

                if(loginData.success) {
                    userData = { ...loginData.data, idPegawai: idPegawai };
                    document.getElementById('display-name').innerText = userData.nama;
                    document.getElementById('display-job').innerText = userData.jabatan;
                    showPage('menu-page');
                } else {
                    Swal.fire('Login Gagal', loginData.message, 'error');
                }
            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire('Error', err.message, 'error');
            }
        });

        async function prepareAction(status) {
            currentStatus = status;
            document.getElementById('action-label').innerText = status;
            document.getElementById('field-masuk').classList.toggle('hidden', status !== 'MASUK');
            document.getElementById('field-pulang').classList.toggle('hidden', status !== 'PULANG');
            
            showPage('action-page');
            
            navigator.geolocation.getCurrentPosition(
                pos => { userGPS = `${pos.coords.latitude},${pos.coords.longitude}`; },
                err => { Swal.fire('GPS Error', 'Aktifkan lokasi Anda', 'error'); showPage('menu-page'); }
            );

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('camera-view').srcObject = stream;
            } catch (err) {
                Swal.fire('Kamera Error', 'Akses kamera ditolak', 'error');
            }
        }

        document.getElementById('btn-capture').addEventListener('click', () => {
            const v = document.getElementById('camera-view');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.translate(c.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0);
            photo = c.toDataURL('image/jpeg', 0.7);
            document.getElementById('photo-preview').src = photo;
            document.getElementById('photo-preview').classList.remove('hidden');
            v.classList.add('hidden');
        });

        document.getElementById('btn-submit').addEventListener('click', async () => {
            if(!photo) return Swal.fire('Foto?', 'Ambil foto selfie dulu', 'warning');
            document.getElementById('loading-overlay').classList.remove('hidden');

            const payload = {
                action: 'record',
                data: {
                    idPegawai: userData.idPegawai,
                    namaLengkap: userData.nama,
                    status: currentStatus,
                    koordinatGPS: userGPS,
                    fotoSelfie: photo,
                    clientTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    keteranganMasuk: document.getElementById('ket-masuk').value,
                    realisasiPekerjaan: document.getElementById('ket-pulang').value
                }
            };

            try {
                const res = await fetch(clientUrl, { method: 'POST', body: JSON.stringify(payload) });
                const resData = await res.json();
                document.getElementById('loading-overlay').classList.add('hidden');
                
                if(resData.success) {
                    Swal.fire('Berhasil!', resData.message, 'success');
                    resetApp();
                } else {
                    Swal.fire('Gagal', resData.message, 'error');
                }
            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire('Error', 'Gagal kirim data', 'error');
            }
        });

        function resetApp() {
            photo = "";
            document.getElementById('camera-view').classList.remove('hidden');
            document.getElementById('photo-preview').classList.add('hidden');
            document.querySelectorAll('input, textarea').forEach(i => { if(i.id !== 'company-id') i.value = ""; });
            showPage('menu-page');
        }

        document.getElementById('logout-button').addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
