<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Zent.id</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card p-4 text-center">
        <h2 class="fw-bold mb-3">Aktivasi Zent.id</h2>
        <p class="text-muted">Masukkan Client ID Perusahaan Anda</p>
        <input type="text" id="client-id" class="form-control form-control-lg mb-3 text-center" placeholder="Contoh: C001">
        <button onclick="connect()" class="btn btn-primary w-100 btn-lg">Hubungkan</button>
    </div>

    <script>
        // PENTING: Ganti URL di bawah ini dengan URL Web App Data Center Bapak yang baru
        const DATA_CENTER_URL = "https://script.google.com/macros/s/AKfycbwidfOhbd9T7QWLX7_VKafYIb5VszzjoJBMfRDGgjasvKRbu3nS3hr8rEyVATo8i6t_-A/exec";

        async function connect() {
            const cid = document.getElementById('client-id').value.trim();
            if(!cid) return Swal.fire('Peringatan', 'Masukkan Client ID!', 'warning');

            Swal.fire({ title: 'Menghubungkan...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            try {
                // Menggunakan mode 'cors' dan menambahkan parameter di URL
                const response = await fetch(`${DATA_CENTER_URL}?clientId=${cid}`);
                const res = await response.json();

                if(res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil Terhubung!',
                        text: 'Selamat Datang ' + res.clientName,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        // Mengarahkan ke Web App milik Customer
                        window.location.href = res.targetUrl;
                    });
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Gagal menghubungi server. Pastikan URL Data Center benar dan sudah di-Deploy sebagai "Anyone".', 'error');
            }
        }
    </script>
</body>
</html>
