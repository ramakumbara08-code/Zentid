<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zent.id - Smart Absensi SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f4f7f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .zent-card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; padding: 25px; }
        .hidden { display: none; }
        #map { height: 200px; border-radius: 10px; margin: 15px 0; border: 1px solid #ddd; }
        #camera-view { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); }
        .btn-zent { background: #0062cc; color: white; border-radius: 8px; padding: 10px 20px; border: none; width: 100%; }
        .btn-zent:hover { background: #004a99; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div id="page-setup" class="zent-card">
                <h3 class="text-center mb-4">Aktivasi Zent.id</h3>
                <div class="mb-3">
                    <label class="form-label">Client ID Perusahaan</label>
                    <input type="text" id="client-id" class="form-control" placeholder="Contoh: ZNT001">
                </div>
                <button onclick="connectToDataCenter()" class="btn btn-zent">Hubungkan Aplikasi</button>
                <p class="text-muted small mt-3 text-center">Hubungi Admin jika belum memiliki ID.</p>
            </div>

            <div id="page-login" class="zent-card hidden">
                <h4 id="display-client-name" class="text-center text-primary mb-3"></h4>
                <div class="mb-3">
                    <input type="text" id="emp-id" class="form-control" placeholder="ID Pegawai">
                </div>
                <div class="mb-3">
                    <input type="password" id="emp-pass" class="form-control" placeholder="Password">
                </div>
                <button onclick="doLogin()" class="btn btn-zent">Masuk</button>
            </div>

            <div id="page-absensi" class="zent-card hidden">
                <h5 id="display-user" class="mb-0"></h5>
                <p id="display-jabatan" class="text-muted small"></p>
                
                <div id="map"></div>
                
                <video id="camera-view" autoplay playsinline></video>
                <canvas id="canvas-photo" class="hidden"></canvas>

                <div class="mt-3">
                    <label class="form-label">Status Presensi:</label>
                    <select id="absensi-status" class="form-select mb-3">
                        <option value="MASUK">MASUK</option>
                        <option value="PULANG">PULANG</option>
                        <option value="IZIN">IZIN</option>
                    </select>
                    
                    <textarea id="keterangan" class="form-control mb-3" placeholder="Catatan/Keterangan..."></textarea>
                    
                    <button onclick="prosesKirimData()" id="btn-kirim" class="btn btn-zent">Kirim Presensi Sekarang</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let clientConfig = {};
    let userData = {};
    let userCoords = "";
    let stream = null;

    const DATA_CENTER_URL = "https://script.google.com/macros/s/AKfycbzXtDxy6y9sEBHy6ZMUavDvwaO2UdPPBIlSbZowyT93nUl84ZxBcUbCta0sznhJ50a-Xw/exec"; 

    // 1. HUBUNGKAN KE DATA CENTER
    async function connectToDataCenter() {
        const cid = document.getElementById('client-id').value;
        if(!cid) return alert("Masukkan Client ID!");

        Swal.fire({title: 'Menghubungkan...', didOpen: () => Swal.showLoading()});

        try {
            const resp = await fetch(`${DATA_CENTER_URL}?clientId=${cid}`);
            const data = await resp.json();

            if(data.success) {
                clientConfig = data;
                localStorage.setItem('zent_cid', cid);
                document.getElementById('display-client-name').innerText = data.clientName;
                showPage('page-login');
                Swal.close();
            } else {
                Swal.fire('Gagal', data.message, 'error');
            }
        } catch (e) {
            Swal.fire('Error', 'Gagal menghubungi Data Center.', 'error');
        }
    }

    // 2. LOGIN PEGAWAI KE GAS CLIENT
    async function doLogin() {
        const id = document.getElementById('emp-id').value;
        const pass = document.getElementById('emp-pass').value;

        Swal.fire({title: 'Memverifikasi...', didOpen: () => Swal.showLoading()});

        const payload = {
            action: "checkLogin",
            payload: { idPegawai: id, password: pass }
        };

        try {
            const resp = await fetch(clientConfig.targetUrl, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const res = await resp.json();

            if(res.success) {
                userData = res.data;
                userData.id = id;
                document.getElementById('display-user').innerText = userData.nama;
                document.getElementById('display-jabatan').innerText = userData.jabatan;
                showPage('page-absensi');
                initAbsensiSystem();
                Swal.close();
            } else {
                Swal.fire('Gagal', res.message, 'error');
            }
        } catch (e) {
            Swal.fire('Error', 'Gagal login ke server client.', 'error');
        }
    }

    // 3. INIT MAP & CAMERA
    function initAbsensiSystem() {
        // Lokasi GPS (Leaflet)
        navigator.geolocation.getCurrentPosition(pos => {
            userCoords = `${pos.coords.latitude},${pos.coords.longitude}`;
            const map = L.map('map').setView([pos.coords.latitude, pos.coords.longitude], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
        }, err => {
            alert("Harap aktifkan GPS Anda!");
        });

        // Kamera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(s => {
                stream = s;
                document.getElementById('camera-view').srcObject = s;
            });
    }

    // 4. KIRIM DATA KE GAS CLIENT
    async function prosesKirimData() {
        const btn = document.getElementById('btn-kirim');
        btn.disabled = true;
        btn.innerText = "Sedang Mengirim...";

        // Ambil Foto dari Video
        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('canvas-photo');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Photo = canvas.toDataURL('image/jpeg');

        const statusAbsen = document.getElementById('absensi-status').value;
        const ket = document.getElementById('keterangan').value;

        const finalPayload = {
            action: "recordAbsence",
            payload: {
                idPegawai: userData.id,
                namaLengkap: userData.nama,
                status: statusAbsen,
                koordinatGPS: userCoords,
                fotoSelfie: base64Photo,
                keteranganMasuk: ket,
                realisasiPekerjaan: ket,
                keteranganIzin: ket
            }
        };

        try {
            const resp = await fetch(clientConfig.targetUrl, {
                method: 'POST',
                body: JSON.stringify(finalPayload)
            });
            const res = await resp.json();

            if(res.success) {
                Swal.fire('Berhasil!', res.message, 'success').then(() => location.reload());
            } else {
                Swal.fire('Gagal', res.message, 'error');
                btn.disabled = false;
            }
        } catch (e) {
            alert("Terjadi kesalahan koneksi.");
            btn.disabled = false;
        }
    }

    function showPage(pageId) {
        document.getElementById('page-setup').classList.add('hidden');
        document.getElementById('page-login').classList.add('hidden');
        document.getElementById('page-absensi').classList.add('hidden');
        document.getElementById(pageId).classList.remove('hidden');
    }

    // Auto-reconnect jika sudah pernah masukkan ID
    window.onload = () => {
        const savedCid = localStorage.getItem('zent_cid');
        if(savedCid) {
            document.getElementById('client-id').value = savedCid;
        }
    };
</script>

</body>
</html>
