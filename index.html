<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Digital - Zent.id</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 20px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        #camera-view, #photo-preview { width: 100%; border-radius: 15px; transform: scaleX(-1); background: #000; }
        #loading-overlay { z-index: 9999; background: rgba(255,255,255,0.9); position: fixed; top: 0; left: 0; }
        .btn-check:checked + .btn-outline-primary { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="hidden w-100 h-100 d-flex flex-column align-items-center justify-content-center">
        <div class="spinner-border text-primary mb-3"></div>
        <p class="fw-bold">Memproses Data ke Server...</p>
    </div>

    <div id="login-page" class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card p-4 shadow w-100" style="max-width: 380px;">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
                <h4 class="fw-bold">Zent.id Login</h4>
            </div>
            <input type="text" id="company-id" class="form-control form-control-lg mb-3" placeholder="ID Perusahaan (Contoh: 1234)">
            
            <input type="text" id="id-pegawai" class="form-control form-control-lg mb-3" placeholder="ID Pegawai">
            <input type="password" id="password" class="form-control form-control-lg mb-4" placeholder="Password">
            <button id="login-button" class="btn btn-primary w-100 btn-lg">MASUK</button>
        </div>
    </div>

    <div id="menu-page" class="container py-5 hidden">
        <div class="card p-4 text-center bg-primary text-white mb-4">
            <h1 id="digital-clock" class="display-3 fw-bold mb-0">00:00</h1>
            <p id="current-date" class="mb-3"></p>
            <h4 id="display-name" class="fw-bold mb-0">-</h4>
            <small id="display-jabatan" class="text-uppercase">Jabatan</small>
        </div>
        <button id="btn-open-absen" class="btn btn-white shadow w-100 py-4 fs-5 fw-bold rounded-4 border-0 mb-3">
            <i class="bi bi-geo-alt-fill me-2 text-primary"></i> MULAI PRESENSI
        </button>
        <button id="logout-button" class="btn btn-danger w-100 py-3 rounded-4 fw-bold">LOGOUT / KELUAR</button>
    </div>

    <div id="absensi-page" class="container py-4 hidden">
        <div class="d-flex align-items-center mb-4">
            <button id="btn-back" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></button>
            <h4 class="mb-0 fw-bold">Kirim Presensi</h4>
        </div>

        <div class="card p-3 mb-3">
            <div class="row g-2">
                <div class="col-3"><input type="radio" class="btn-check" name="status" id="s1" value="MASUK"><label class="btn btn-outline-primary w-100 py-2 small fw-bold" for="s1">MASUK</label></div>
                <div class="col-3"><input type="radio" class="btn-check" name="status" id="s2" value="PULANG"><label class="btn btn-outline-success w-100 py-2 small fw-bold" for="s2">PULANG</label></div>
                <div class="col-3"><input type="radio" class="btn-check" name="status" id="s3" value="IZIN"><label class="btn btn-outline-warning w-100 py-2 small fw-bold" for="s3">IZIN/S</label></div>
                <div class="col-3"><input type="radio" class="btn-check" name="status" id="s4" value="LIBUR"><label class="btn btn-outline-secondary w-100 py-2 small fw-bold" for="s4">LIBUR</label></div>
            </div>
        </div>

        <div id="box-tanggal-khusus" class="card p-3 mb-3 hidden border-primary">
            <label class="form-label small fw-bold text-primary">TENTUKAN TANGGAL KEJADIAN:</label>
            <input type="date" id="tgl-khusus" class="form-control">
        </div>

        <div id="box-masuk" class="mb-3 hidden"><input type="text" id="ket-masuk" class="form-control" placeholder="Keterangan Masuk"></div>
        <div id="box-pulang" class="mb-3 hidden"><textarea id="ket-pulang" class="form-control" placeholder="Realisasi Pekerjaan Hari Ini"></textarea></div>
        <div id="box-izin" class="mb-3 hidden"><textarea id="ket-izin" class="form-control" placeholder="Alasan Izin/Sakit/Libur"></textarea></div>

        <div id="camera-area" class="card p-2 bg-dark mb-3 shadow">
            <video id="camera-view" autoplay playsinline></video>
            <img id="photo-preview" class="hidden">
            <canvas id="camera-canvas" class="hidden"></canvas>
            <button id="btn-snap" class="btn btn-warning w-100 mt-2 fw-bold">AMBIL FOTO SELFIE</button>
        </div>

        <div id="gps-status" class="alert alert-secondary text-center small py-2 mb-3">Mencari Koordinat GPS...</div>
        <button id="btn-submit" class="btn btn-primary w-100 btn-lg py-3 shadow" disabled>KIRIM PRESENSI</button>
    </div>

    <script>
        // CONFIGURATION
        const MASTER_URL = "https://script.google.com/macros/s/AKfycbxPF6sDSg9sYx-zxzob_e6cltBRlEY4yhUnauWN0ttvPXFEdMMzMgZb8YQhe--smfaZVw/exec"; 

        let userData = {}; 
        let userGPS = ""; 
        let stream = null; 
        let photo = "";
        let clientUrl = ""; // URL Database perusahaan klien

        // Load Company ID if exists
        window.onload = () => {
            const savedCompanyId = localStorage.getItem('company_id');
            if(savedCompanyId) document.getElementById('company-id').value = savedCompanyId;
        };

        // Jam Digital (Asli)
        setInterval(() => {
            const n = new Date();
            document.getElementById('digital-clock').textContent = n.toLocaleTimeString('id-ID', {hour12:false, hour:'2-digit', minute:'2-digit'});
            document.getElementById('current-date').textContent = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        }, 1000);

        function showPage(id) {
            ['login-page', 'menu-page', 'absensi-page'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // LOGIN HANDSHAKE (Gabungan Logika Multi-Company ke Form Anda)
        document.getElementById('login-button').addEventListener('click', async () => {
            const companyId = document.getElementById('company-id').value;
            const id = document.getElementById('id-pegawai').value;
            const pw = document.getElementById('password').value;
            
            if(!companyId || !id || !pw) return Swal.fire('Peringatan', 'Lengkapi ID Perusahaan, ID Pegawai & Password', 'warning');
            
            document.getElementById('loading-overlay').classList.remove('hidden');
            
            try {
                // TAHAP 1: Ambil URL Perusahaan dari Master
                const masterRes = await fetch(MASTER_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: 'get_client_config', companyId: companyId })
                });
                const masterData = await masterRes.json();

                if(!masterData.success) {
                    throw new Error(masterData.message);
                }

                clientUrl = masterData.url;
                localStorage.setItem('company_id', companyId);

                // TAHAP 2: Login ke URL Perusahaan tersebut (Fungsi Asli Anda)
                const loginRes = await fetch(clientUrl, {
                    method: "POST",
                    body: JSON.stringify({ action: 'login', idPegawai: id, password: pw })
                });
                const loginData = await loginRes.json();

                document.getElementById('loading-overlay').classList.add('hidden');

                if(loginData.success) {
                    userData = {id, nama:loginData.data.nama, jabatan:loginData.data.jabatan};
                    document.getElementById('display-name').textContent = loginData.data.nama;
                    document.getElementById('display-jabatan').textContent = loginData.data.jabatan;
                    showPage('menu-page');
                    getGPS();
                } else { Swal.fire('Gagal', loginData.message, 'error'); }

            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire('Error', err.message, 'error');
            }
        });

        // FUNGSI GPS (Asli)
        function getGPS() {
            if (!navigator.geolocation) return Swal.fire('Error', 'Browser tidak mendukung GPS', 'error');
            navigator.geolocation.getCurrentPosition(p => {
                userGPS = `${p.coords.latitude},${p.coords.longitude}`;
                const statusGps = document.getElementById('gps-status');
                statusGps.className = "alert alert-success text-center small py-2 mb-3";
                statusGps.textContent = "GPS Terkunci (Lokasi Siap)";
                checkReady();
            }, (err) => {
                Swal.fire('GPS Error', 'Mohon aktifkan GPS dan berikan izin lokasi!', 'error');
            }, { enableHighAccuracy: true });
        }

        // BUKA HALAMAN ABSEN (Asli)
        document.getElementById('btn-open-absen').addEventListener('click', async () => {
            showPage('absensi-page');
            try {
                stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
                document.getElementById('camera-view').srcObject = stream;
            } catch(e) { Swal.fire('Kamera Error', 'Izin kamera diperlukan!', 'error'); }
        });

        // AMBIL FOTO (Asli)
        document.getElementById('btn-snap').addEventListener('click', () => {
            const v = document.getElementById('camera-view');
            const c = document.getElementById('camera-canvas');
            c.width = v.videoWidth; 
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            photo = c.toDataURL('image/jpeg', 0.7);
            document.getElementById('photo-preview').src = photo;
            document.getElementById('photo-preview').classList.remove('hidden');
            v.classList.add('hidden');
            checkReady();
        });

        // LOGIKA RADIO BUTTON & FORM (Asli)
        document.querySelectorAll('input[name="status"]').forEach(r => {
            r.addEventListener('change', e => {
                const v = e.target.value;
                document.getElementById('box-masuk').classList.toggle('hidden', v !== 'MASUK');
                document.getElementById('box-pulang').classList.toggle('hidden', v !== 'PULANG');
                document.getElementById('box-izin').classList.toggle('hidden', !['IZIN','LIBUR','SAKIT'].includes(v));
                document.getElementById('box-tanggal-khusus').classList.toggle('hidden', !['IZIN','LIBUR','SAKIT'].includes(v));
                
                if(['IZIN','LIBUR','SAKIT'].includes(v)) { 
                    photo = "BYPASS_FOR_PERMISSION"; 
                    document.getElementById('camera-area').classList.add('hidden');
                    if(!document.getElementById('tgl-khusus').value) {
                        document.getElementById('tgl-khusus').value = new Date().toISOString().split('T')[0];
                    }
                } else { 
                    photo = ""; 
                    document.getElementById('camera-area').classList.remove('hidden');
                    document.getElementById('photo-preview').classList.add('hidden');
                    document.getElementById('camera-view').classList.remove('hidden');
                }
                checkReady();
            });
        });

        function checkReady() {
            const s = document.querySelector('input[name="status"]:checked');
            document.getElementById('btn-submit').disabled = !(s && userGPS && photo !== "");
        }

        // SUBMIT DATA (Diarahkan ke ClientUrl)
        document.getElementById('btn-submit').addEventListener('click', () => {
            const s = document.querySelector('input[name="status"]:checked').value;
            document.getElementById('loading-overlay').classList.remove('hidden');
            
            const dataAbsen = {
                idPegawai: userData.id, 
                namaLengkap: userData.nama, 
                status: s,
                koordinatGPS: userGPS, 
                fotoSelfie: photo,
                clientTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                tglPilihan: document.getElementById('tgl-khusus').value,
                keteranganMasuk: document.getElementById('ket-masuk').value,
                realisasiPekerjaan: document.getElementById('ket-pulang').value,
                keteranganIzin: document.getElementById('ket-izin').value
            };

            fetch(clientUrl, { // MENGGUNAKAN URL PERUSAHAAN HASIL HANDSHAKE
                method: "POST",
                body: JSON.stringify({ action: 'record', data: dataAbsen })
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-overlay').classList.add('hidden');
                if(res.success) {
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: res.message });
                    resetAppUI();
                } else { Swal.fire('Gagal Presensi', res.message, 'error'); }
            })
            .catch(err => {
                document.getElementById('loading-overlay').classList.add('hidden');
                Swal.fire('Error', 'Gagal mengirim data', 'error');
            });
        });

        function resetAppUI() {
            if(stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            photo = "";
            document.querySelectorAll('input[name="status"]').forEach(r => r.checked = false);
            document.querySelectorAll('input[type="text"], textarea, input[type="date"]').forEach(i => {
                if(i.id !== 'company-id') i.value = "";
            });
            showPage('menu-page');
        }

        document.getElementById('btn-back').addEventListener('click', () => {
            if(stream) stream.getTracks().forEach(t => t.stop());
            showPage('menu-page');
        });

        document.getElementById('logout-button').addEventListener('click', () => {
            Swal.fire({ title: 'Logout?', icon: 'warning', showCancelButton: true }).then(r => { if(r.isConfirmed) location.reload(); });
        });
    </script>
</body>
</html>
